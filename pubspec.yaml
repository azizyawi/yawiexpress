name: wanmac
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.5+11

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  http: ^1.6.0
  google_maps_flutter: ^2.16.0
  shared_preferences: ^2.5.5
  flutter_riverpod: ^3.3.1
  webview_flutter: ^4.13.1
  web_socket_channel: ^3.0.3
  intl: ^0.20.2
  url_launcher: ^6.3.2
  flutter_polyline_points: ^3.1.0
  google_maps_flutter_android: ^2.19.8
  google_maps_flutter_platform_interface: ^2.15.0
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0
  location: ^8.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# 👇 THIS MUST BE OUTSIDE EVERYTHING
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/map_style.json  # Add this line explicitly